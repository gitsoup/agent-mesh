name: Feature request
description: Propose an improvement for maintainers to assess.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Requests enter the public queue as `needs-triage`. Maintainers decide whether to approve and scope them before implementation begins.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who has this problem, and what happens today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the user-visible result rather than a particular implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would show the request is complete.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
